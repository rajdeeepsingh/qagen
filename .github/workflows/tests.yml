name: QaGen API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        id: pytest
        continue-on-error: true
        env:
          JSONPLACEHOLDER_URL: https://jsonplaceholder.typicode.com
          REQRES_URL: https://reqres.in/api
        run: python -m pytest tests/ -v --junitxml=results.xml

      - name: Send results to n8n
        if: always()
        run: |
          PASSED=$(grep -oP 'tests="\K[0-9]+' results.xml | head -1)
          FAILED=$(grep -oP 'failures="\K[0-9]+' results.xml | head -1)
          curl -X POST https://silenced-perceive-viper.ngrok-free.dev/webhook/qagen-results \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$([ $FAILED -eq 0 ] && echo success || echo failure)\",\"total\":$PASSED,\"passed\":$((PASSED-FAILED)),\"failed\":$FAILED,\"report_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Fail workflow if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1